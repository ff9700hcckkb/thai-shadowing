<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai-shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2b2a;--sub:#6a7776;--line:#dcd8cd;--acc:#0f6b66;--accfg:#fff;--on:#e3f0ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a19;--card:#1b2625;--ink:#e8efee;--sub:#92a2a0;--line:#2c3a39;--acc:#4fc1b8;--accfg:#08201e;--on:#1f3533}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0 10px;z-index:5;display:flex;flex-wrap:wrap;gap:8px}
#src{flex:1 1 100%;font-family:"Noto Serif Thai",serif;font-size:17px}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:10px 0;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
select{font:inherit;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.item.on{background:var(--on);border-color:var(--acc)}
.txt{flex:1;min-width:0}
.th{font-family:"Noto Serif Thai",serif;font-size:22px;line-height:1.6;word-break:break-word}
.zh{font-size:15px;color:var(--sub)}
.pos{font-size:12px;color:var(--sub)}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:18px;cursor:pointer}
.msg{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:8px;display:none}
</style>
</head>
<body>
<main>
<h1>Thai-shadowing</h1>
<div class="bar">
  <select id="src" aria-label="來源"></select>
  <div class="seg" role="group" aria-label="模式">
    <button id="mWord" aria-pressed="true">單字</button>
    <button id="mSent" aria-pressed="false">句子</button>
  </div>
  <select id="rate" aria-label="語速">
    <option value="0.6">0.6×</option>
    <option value="0.8">0.8×</option>
    <option value="1" selected>1×</option>
  </select>
</div>
<div class="msg" id="voiceMsg">這支手機找不到泰文語音。請到系統設定安裝泰文語音（Android：文字轉語音設定；iPhone：設定 › 輔助使用 › 語音內容）。</div>
<div class="msg" id="errMsg"></div>
<div id="list"></div>
</main>
<script>
var mode="word",voice=null,playing=null,cache={},items=[];
var $=function(i){return document.getElementById(i)};

function parse(text){
  var out=[],cur=null;
  text.replace(/^\uFEFF/,"").split(/\r?\n/).forEach(function(l){
    l=l.trim();var m;
    if((m=l.match(/^\d+\s*[.．、]\s*(.+?)\s*[：:]\s*(.*)$/))){
      var rest=m[2].split(/\s+/);
      cur={w:m[1],pos:rest.shift()||"",zh:rest.join(" ").replace(/\s+\d+$/,""),s:"",t:""};
      out.push(cur);
    }else if(cur&&(m=l.match(/^泰文例句\s*[：:]\s*(.+)$/))){cur.s=m[1]}
    else if(cur&&(m=l.match(/^中文翻譯\s*[：:]\s*(.+)$/))){cur.t=m[1]}
  });
  return out;
}

function showErr(t){var e=$("errMsg");e.textContent=t;e.style.display=t?"block":"none"}

function pick(){
  var vs=speechSynthesis.getVoices();
  voice=vs.filter(function(v){return /^th/i.test(v.lang.replace("_","-"))})[0]||null;
  $("voiceMsg").style.display=(vs.length&&!voice)?"block":"none";
}
if("speechSynthesis" in window){pick();speechSynthesis.onvoiceschanged=pick}

function say(text,row){
  if(!("speechSynthesis" in window)){showErr("這個瀏覽器不支援語音朗讀，請改用 Safari（iPhone）或 Chrome（Android），不要用 LINE／FB 內建瀏覽器。");return}
  showErr("");
  var ss=window.speechSynthesis;
  ss.cancel();
  if(playing)playing.classList.remove("on");
  if(!voice)pick();
  var u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,""));
  u.lang="th-TH";if(voice)u.voice=voice;
  u.rate=parseFloat($("rate").value);
  var started=false;
  row.classList.add("on");playing=row;
  u.onstart=function(){started=true};
  u.onend=function(){row.classList.remove("on")};
  u.onerror=function(e){
    row.classList.remove("on");
    if(e.error!=="canceled"&&e.error!=="interrupted")showErr("朗讀失敗（"+e.error+"）。請確認已安裝泰文語音。");
  };
  setTimeout(function(){
    ss.speak(u);
    if(ss.paused)ss.resume();
    setTimeout(function(){
      if(!started&&!ss.speaking){
        row.classList.remove("on");
        showErr("沒有聲音。請檢查：1) 手機未開靜音（iPhone 側邊靜音鈕）、媒體音量已調高；2) 已安裝泰文語音；3) 用 Safari／Chrome 開啟。");
      }
    },1500);
  },80);
}
function render(){
  var L=$("list");L.innerHTML="";
  var w=mode==="word";
  items.forEach(function(r){
    var th=w?r.w:r.s,zh=w?r.zh:r.t;
    if(!th)return;
    var row=document.createElement("div");row.className="item";
    var t=document.createElement("div");t.className="txt";
    var a=document.createElement("div");a.className="th";a.lang="th";a.textContent=th;
    t.appendChild(a);
    if(w&&r.pos){var p=document.createElement("div");p.className="pos";p.textContent=r.pos;t.appendChild(p)}
    var b=document.createElement("div");b.className="zh";b.textContent=zh;t.appendChild(b);
    var btn=document.createElement("button");btn.className="play";btn.textContent="▶";
    btn.setAttribute("aria-label","播放："+th);
    btn.onclick=function(){say(th,row)};
    row.appendChild(t);row.appendChild(btn);L.appendChild(row);
  });
}

function load(name){
  showErr("");speechSynthesis.cancel();
  try{localStorage.setItem("thai-src",name)}catch(e){}
  if(cache[name]){items=cache[name];render();return}
  fetch("data/"+encodeURIComponent(name)).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.text();
  }).then(function(t){
    cache[name]=parse(t);items=cache[name];render();
    if(!items.length)showErr("這個檔案沒有讀到任何項目，請檢查格式。");
  }).catch(function(){showErr("無法讀取 "+name)});
}

function setMode(m){
  mode=m;speechSynthesis.cancel();
  $("mWord").setAttribute("aria-pressed",m==="word");
  $("mSent").setAttribute("aria-pressed",m==="sent");
  render();
}
$("mWord").onclick=function(){setMode("word")};
$("mSent").onclick=function(){setMode("sent")};
$("src").onchange=function(){load(this.value)};

function listSources(){
  var m=location.hostname.match(/^(.+)\.github\.io$/);
  var repo=location.pathname.split("/")[1]||location.hostname;
  var viaIndex=function(){return fetch("data/index.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})};
  if(!m)return viaIndex();
  return fetch("https://api.github.com/repos/"+m[1]+"/"+repo+"/contents/data")
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
    .then(function(a){return a.map(function(f){return f.name}).filter(function(n){return /\.txt$/i.test(n)}).sort()})
    .catch(viaIndex);
}
listSources().then(function(names){
  var s=$("src"),saved=null;
  try{saved=localStorage.getItem("thai-src")}catch(e){}
  names.forEach(function(n){
    var o=document.createElement("option");o.value=n;o.textContent=n.replace(/\.txt$/i,"");s.appendChild(o);
  });
  if(!names.length){showErr("data/ 資料夾裡還沒有 txt 檔。");return}
  if(saved&&names.indexOf(saved)>-1)s.value=saved;
  load(s.value);
}).catch(function(){showErr("讀不到來源清單。請確認 data/ 資料夾有 txt 檔且已完成部署（本機預覽請用 http server）。")});
</script>
</body>
</html>
